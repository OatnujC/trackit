<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0f14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="JT Workout">
<title>JT's Badminton Workout</title>
<style>
:root{--bg:#0b0f14;--card:#151c25;--card2:#1c2531;--line:#263241;--txt:#e9eef4;--mut:#93a1b2;--acc:#c6ff3d;--acc2:#2ee6a6;--warn:#ffb020;--bad:#ff5c6c}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--txt);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
body{padding-bottom:calc(150px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:20;background:rgba(11,15,20,.94);backdrop-filter:blur(8px);padding:calc(10px + env(safe-area-inset-top)) 14px 8px;border-bottom:1px solid var(--line)}
h1{font-size:19px;margin:0 0 2px;letter-spacing:.2px}h1 span{color:var(--acc)}
.sub{color:var(--mut);font-size:13px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:8px 0 2px;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;min-width:52px;min-height:44px;padding:6px 12px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--txt);font-weight:600;font-size:14px;cursor:pointer}
.tab.on{background:var(--acc);color:#0b0f14;border-color:var(--acc)}
.tab .today{display:block;font-size:10px;font-weight:700;opacity:.8}
main{max-width:760px;margin:0 auto;padding:12px}
.hero{background:linear-gradient(135deg,#1b2a12,#10202a);border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:12px}
.hero h2{margin:0;font-size:22px}.hero p{margin:4px 0 10px;color:var(--mut);font-size:14px}
.bar{height:12px;background:#0006;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--acc2),var(--acc));transition:width .3s}
.prow{display:flex;justify-content:space-between;align-items:center;margin-top:8px;font-size:14px;color:var(--mut)}
.btn{min-height:44px;padding:8px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card2);color:var(--txt);font-weight:600;font-size:15px;cursor:pointer}
.btn.pri{background:var(--acc);color:#0b0f14;border-color:var(--acc)}.btn.sm{min-height:36px;padding:4px 10px;font-size:13px}
h3.sec{margin:20px 4px 8px;font-size:15px;text-transform:uppercase;letter-spacing:1px;color:var(--acc)}
.note{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin:8px 0;color:var(--mut);font-size:14px}
.note b{color:var(--txt)}
.card{display:grid;grid-template-columns:112px 1fr;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px;margin:8px 0}
.card.done{border-color:var(--acc2);background:#122420}
.thumb{width:112px;height:63px;border-radius:10px;object-fit:cover;background:#000;display:block}
.card h4{margin:0;font-size:16px}.sets{color:var(--acc);font-weight:700;font-size:14px;margin:2px 0}.cue{color:var(--mut);font-size:14px;margin:2px 0 6px}
.src{font-size:11px;color:var(--mut);margin-top:4px}
.chk{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.chk label{position:relative}
.chk input{position:absolute;opacity:0;width:1px;height:1px}
.chk span{display:flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:12px;border:2px solid var(--line);background:var(--card2);font-weight:700;color:var(--mut);cursor:pointer}
.chk input:checked+span{background:var(--acc2);border-color:var(--acc2);color:#0b0f14}
.chk input:focus-visible+span{outline:2px solid var(--acc)}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
a.watch{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:6px 12px;border-radius:10px;background:#ff3b3b;color:#fff;text-decoration:none;font-weight:700;font-size:14px}
.rule{border:1px solid var(--warn);background:#2a2110;border-radius:16px;padding:12px;margin:10px 0}
.rule h4{margin:0 0 4px;color:var(--warn)}.rule p{margin:4px 0;font-size:14px}
.hist{list-style:none;padding:0;margin:8px 0 0;font-size:13px;color:var(--mut)}.hist li{padding:3px 0;border-top:1px solid #ffffff10}
.ok{color:var(--acc2);font-weight:700}.stiff{color:var(--bad);font-weight:700}
.cue-row{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin:8px 0}.cue-row b{display:block;color:var(--acc);margin-bottom:2px}
table.wk{width:100%;border-collapse:collapse;font-size:14px}table.wk td{padding:8px;border-top:1px solid var(--line)}table.wk tr.cur td{color:var(--acc);font-weight:700}
#timer{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(16,22,30,.97);border-top:1px solid var(--line);padding:8px 12px calc(8px + env(safe-area-inset-bottom));backdrop-filter:blur(8px)}
#timer .in{max-width:760px;margin:0 auto}
.trow{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
#tdisp{font:700 30px/1 ui-monospace,SFMono-Regular,Menlo,monospace;min-width:92px;color:var(--acc)}
#tlabel{font-size:12px;color:var(--mut);width:100%;margin-bottom:4px}
#timer.alarm{animation:fl .4s 6 alternate}@keyframes fl{to{background:#3a4a10}}
#timer .btn{min-height:42px;padding:6px 10px;font-size:14px}
.hide{display:none!important}
@media (min-width:600px){.card{grid-template-columns:160px 1fr}.thumb{width:160px;height:90px}}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.chip{min-height:44px;padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--txt);font-weight:600;font-size:14px;cursor:pointer}
.chip.on{background:var(--acc);color:#0b0f14;border-color:var(--acc)}
.chip.dim{opacity:.55}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}
@media (min-width:520px){.tiles{grid-template-columns:1fr 1fr 1fr 1fr}}
.tile{min-height:72px;padding:12px;border-radius:16px;border:1px solid var(--line);background:var(--card);color:var(--txt);text-align:left;cursor:pointer;font-weight:700;font-size:14px;line-height:1.25}
.tile small{display:block;font-weight:500;color:var(--mut);font-size:12px;margin-top:4px}
.tile.on{border-color:var(--acc);background:#1b2a12;box-shadow:inset 0 0 0 1px var(--acc)}
.cta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:10px 0;padding:12px;border-radius:16px;border:1px solid var(--acc);background:#162210}
.cta p{margin:0;flex:1;font-size:14px;color:var(--mut)}.cta b{color:var(--txt)}
.fold{border:1px solid var(--warn);background:#2a2110;border-radius:14px;margin:8px 0;overflow:hidden}
.fold>button{width:100%;min-height:44px;padding:10px 12px;background:transparent;border:0;color:var(--warn);font-weight:700;font-size:14px;text-align:left;cursor:pointer;display:flex;justify-content:space-between;align-items:center}
.fold .fold-body{padding:0 12px 12px;font-size:14px;color:var(--mut);display:none}
.fold.open .fold-body{display:block}
.dcard{background:var(--card);border:1px solid var(--line);border-radius:16px;margin:8px 0;overflow:hidden}
.dcard.done{border-color:var(--acc2);background:#122420}
.dcard>button.head{width:100%;display:grid;grid-template-columns:72px 1fr 28px;gap:10px;align-items:center;padding:10px;background:transparent;border:0;color:var(--txt);text-align:left;cursor:pointer;min-height:64px}
.dcard .thumb-sm{width:72px;height:40px;border-radius:8px;object-fit:cover;background:#000}
.dcard .meta h4{margin:0;font-size:15px}.dcard .meta .sets{margin:0;font-size:13px}
.dcard .chev{color:var(--mut);font-size:18px;text-align:center}
.dcard .body{display:none;padding:0 12px 12px;border-top:1px solid #ffffff10}
.dcard.open .body{display:block}
.dcard.open .chev{transform:rotate(90deg)}
.badge{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--card2);color:var(--mut);margin-right:4px}
.badge.partner{color:var(--acc2)}.badge.solo{color:var(--acc)}
.filter-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:8px 0}
.filter-row .lab{font-size:12px;color:var(--mut);width:100%}
.shot-card{background:var(--card);border:1px solid var(--line);border-radius:16px;margin:8px 0;overflow:hidden}
.shot-card>button.head{width:100%;display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px;min-height:52px;background:transparent;border:0;color:var(--txt);font-weight:700;font-size:15px;text-align:left;cursor:pointer}
.shot-card .body{display:none;padding:0 12px 12px;border-top:1px solid #ffffff10;font-size:14px;color:var(--mut)}
.shot-card.open .body{display:block}
.shot-card h5{margin:12px 0 4px;color:var(--acc);font-size:13px;text-transform:uppercase;letter-spacing:.6px}
.shot-card ol{margin:4px 0 0;padding-left:18px}.shot-card li{margin:3px 0}
.shot-card .cues{margin:0;padding:0;list-style:none}.shot-card .cues li{padding:6px 0;border-top:1px solid #ffffff10}
.shot-card .cues li:first-child{border-top:0}
.shot-thumb{width:100%;max-width:280px;height:auto;aspect-ratio:16/9;border-radius:10px;object-fit:cover;background:#000;margin:8px 0;display:block}
</style>
</head>
<body>

 Mon:{title:"Technique: movement + rehab finisher",desc:"About 55–65 min, at home, in the gym or on court. Slow → fast shadow first while fresh, then controlled-movement and short-swing work, intervals, then the calf finisher. Goal: low, level, controlled — no bouncing.",blocks:[["Warm-up","warmup"],["Glute & core activation","activate"],["Slow → fast shadow (6 corners)","tech_shadow"],["Controlled movement","tech_move"],["Short swing","tech_swing"],["Conditioning","cond"],["Rehab finisher","fin"]],note:"<b>Glute timing:</b> fire at the push-off, the lunge landing and the push back to base. In between, a light 20–30% brace — switched on, not clenched. Film one slow and one fast shadow round from the side this week and check your head height.",drillsCta:true,drillsFocus:["drill_move","drill_swing"],rule:true},
 Tue:{title:"Home routine + court",desc:"15–20 min home routine, then take the cues onto court. Use Drills for today's focus before or after.",blocks:[["Home routine","home"]],drillsFocus:["drill_move","drill_swing"],note:"<b>On court:</b> stay low and level (low ceiling), small split step on every opponent hit, glide don't hop, short swing with the racket stopping after contact, racket up after every shot, scissor-land-go on smashes, chest proud in the net lunge and push back with 2 quick steps.",drillsCta:true},
 Wed:{title:"Calf rehab + recovery swim",desc:"About 20 min rehab, then an easy 20–30 min swim or bike and a sauna. Aim to finish 2–4 hours before bed for better sleep.",blocks:[["Calf & Achilles rehab","rehab"],["Recovery: swim, bike, sauna","recovery"]],rule:true},
 Thu:{title:"Technique: swing + rehab finisher",desc:"Same blocks as Monday, but short swing comes before controlled movement so your hands are fresh. Aim for cleaner reps than Monday, not more load.",blocks:[["Warm-up","warmup"],["Glute & core activation","activate"],["Slow → fast shadow (6 corners)","tech_shadow"],["Short swing","tech_swing"],["Controlled movement","tech_move"],["Conditioning","cond"],["Rehab finisher","fin"]],note:"<b>Glute timing:</b> fire at the push-off, the lunge landing and the push back to base. In between, a light 20–30% brace — switched on, not clenched. Short-swing check: racket up in front of your chest, power from fingers and forearm, hit in front, stop after contact.",drillsCta:true,drillsFocus:["drill_swing","drill_move"],rule:true},
 Fri:{title:"Home + isometric holds",desc:"Light day before matches: home routine plus isometric calf holds. No heavy legs. Pick 1–2 drill focuses.",blocks:[["Home routine","home"],["Isometric holds","iso"]],drillsCta:true,drillsFocus:["drill_swing"]},

function londonDate(){
 try{var p=new Intl.DateTimeFormat("en-GB",{timeZone:"Europe/London",year:"numeric",month:"2-digit",day:"2-digit",weekday:"short"}).formatToParts(new Date());var o={};p.forEach(function(x){o[x.type]=x.value});return {key:o.year+"-"+o.month+"-"+o.day,wd:o.weekday.slice(0,3)};}
 catch(e){var d=new Date();return {key:d.toISOString().slice(0,10),wd:DAYS[d.getDay()]};}
}

 if(s.url!=="NONE"){
  h+='<h5>Demo</h5><img class="shot-thumb" alt="'+esc(s.vt)+'" src="'+s.img+'">';
  h+='<div class="actions"><a class="watch" target="_blank" rel="noopener" href="https://www.youtube.com/watch?v='+s.vid+'">▶ Watch demo</a></div>';
  h+='<div class="src">'+esc(s.vt)+' · '+esc(s.ch)+'</div>';
 }
 if(s.drill){
  var dr=DRILLS.filter(function(d){return d.id===s.drill})[0];
  if(dr) h+='<div class="actions" style="margin-top:10px"><button class="btn sm" data-v="drills" data-focus-jump="'+s.drill+'">Related drills: '+esc(dr.short)+'</button></div>';
 }
 h+='</div></div>';
 return h;
}
function shotsHtml(){
 var h='<section class="hero"><h2>Shots how-to</h2><p>Doubles technique for each shot. Built around your cues: racket up, hips first, tap not swing, tight net, scissor landings.</p></section>';
 h+='<div class="chips">';
 h+='<button class="chip'+(!(window._shotFilter)?" on":"")+'" type="button" data-shot-filter="">All</button>';
 SHOT_GROUPS.forEach(function(g){
  var on=window._shotFilter===g;
  h+='<button class="chip'+(on?" on":"")+'" type="button" data-shot-filter="'+esc(g)+'">'+esc(g)+'</button>';
 });
 h+='</div>';
 var list=SHOTS.filter(function(s){return !window._shotFilter||s.group===window._shotFilter});
 list.forEach(function(s){h+=shotCard(s,!!shotOpen[s.id])});
 return h;
}
function drillsCtaHtml(V){
 var f=(V&&V.drillsFocus)||[];
 if(!f.length) return '<div class="cta"><p><b>Drills for today</b> — pick 1–2 focuses while fresh, then take them onto court.</p><button class="btn pri" data-v="drills">Open Drills</button></div>';
 var names=f.map(function(id){var d=DRILLS.filter(function(x){return x.id===id})[0];return d?d.short:id}).join(" + ");
 return '<div class="cta"><p><b>Drills for today: '+esc(names)+'</b> — the focuses that match this session. Solo cards work at home; partner cards on court.</p><button class="btn pri" data-focus-jump="'+f.join(",")+'">Open Drills</button></div>';
}

function render(){
 tabs();
 var v=current.v,h="",m=document.getElementById("main");
 document.getElementById("datesub").textContent="Today: "+TODAY.wd+" "+TODAY.key+" · "+(VIEWS[TODAY.wd]?VIEWS[TODAY.wd].title:"");
 if(VIEWS[v]){
  var V=VIEWS[v],p=progress(V.blocks),pc=p[1]?Math.round(p[0]/p[1]*100):0;
  h+='<section class="hero"><h2>'+v+": "+esc(V.title)+(v===TODAY.wd?" <small style=\"color:var(--acc);font-size:13px\">TODAY</small>":"")+'</h2><p>'+esc(V.desc)+'</p>';
  if(p[1])h+='<div class="bar"><i id="pbar" style="width:'+pc+'%"></i></div><div class="prow"><span id="ptxt">'+p[0]+" / "+p[1]+" sets · "+pc+'%</span><button class="btn sm" id="resetday">Reset today</button></div>';
  h+="</section>";
  if(V.drillsCta)h+=drillsCtaHtml(V);
  if(V.rule||V.blocks.some(function(b){return b[1]==="plyo"}))h+=ruleBox();
  if(V.note)h+='<div class="note">'+V.note+"</div>";
  if(V.match){h+='<h3 class="sec">Match-day cues</h3>';MATCH.forEach(function(c){h+='<div class="cue-row"><b>'+esc(c[0])+"</b>"+esc(c[1])+"</div>"})}
  V.blocks.forEach(function(b){h+='<h3 class="sec">'+esc(b[0])+"</h3>";G[b[1]].forEach(function(e,i){h+=card(e,b[1],i)})});
  if(v==="Sun")h+=cuesHtml();
 }else if(v==="all"){
  h+='<section class="hero"><h2>All sections</h2><p>Every exercise in the plan. Ticks here are saved for today too.</p></section>';
  SECTIONS.forEach(function(s){h+='<h3 class="sec">'+esc(s[1])+"</h3>";G[s[0]].forEach(function(e,i){h+=card(e,s[0],i)})});
  h+=ruleBox()+cuesHtml();
 }else if(v==="drills"){
  h+=drillsHtml();
 }else if(v==="shots"){
  h+=shotsHtml();
 }else if(v==="cues"){h+=cuesHtml()+ruleBox()}
 else if(v==="week"){
  h+='<section class="hero"><h2>Weekly schedule</h2><p>No heavy legs or calf work the day before you play.</p></section><div class="note"><table class="wk">';
  ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"].forEach(function(d){h+='<tr class="'+(d===TODAY.wd?"cur":"")+'"><td>'+d+"</td><td>"+esc(VIEWS[d].title)+'</td><td><button class="btn sm" data-v="'+d+'">Open</button></td></tr>'});
  h+="</table></div>";
 }
 m.innerHTML=h;
}
function updProgress(){
 if(current.v==="drills"){
  var sel=selectedDrills(),t=0,dcount=0;
  sel.forEach(function(dr){filteredExercises(dr).forEach(function(x){var n=nSets(x.e.sets),arr=state[dr.id+"-"+x.i+"-"+x.e.vid]||[];t+=n;for(var k=0;k<n;k++)if(arr[k])dcount++})});
  var pc=t?Math.round(dcount/t*100):0;
  var b=document.getElementById("pbar"),el=document.getElementById("ptxt");if(b)b.style.width=pc+"%";if(el)el.textContent=dcount+" / "+t+" sets · "+pc+"%"+(pc===100?" 🎉":"");
  return;
 }
 var blocks=null;
 if(VIEWS[current.v])blocks=VIEWS[current.v].blocks;
 if(!blocks)return;var p=progress(blocks),pc=p[1]?Math.round(p[0]/p[1]*100):0;
 var b=document.getElementById("pbar"),t=document.getElementById("ptxt");if(b)b.style.width=pc+"%";if(t)t.textContent=p[0]+" / "+p[1]+" sets · "+pc+"%"+(pc===100?" 🎉":"");
}
document.addEventListener("click",function(ev){
 var t=ev.target.closest("[data-focus-jump],[data-v],[data-rest],[data-ci],#resetday,[data-focus],[data-mode],[data-toggle-drill],[data-toggle-fold],[data-toggle-shot],[data-shot-filter],[data-focus-jump]");
 if(!t)return;
 if(t.dataset.focusJump){
  drillFocus=t.dataset.focusJump.split(",").slice(0,2);save("jtw:drillfocus:"+TODAY.key,drillFocus);
  current={date:TODAY.key,v:"drills"};save("jtw:view",current);render();window.scrollTo(0,0);return;
 }
 if(t.dataset.v){current={date:TODAY.key,v:t.dataset.v};save("jtw:view",current);render();window.scrollTo(0,0);return}
 if(t.dataset.rest){setRest(parseInt(t.dataset.rest,10),true);return}
 if(t.dataset.ci){var hist=load("jtw:checkins",[]).filter(function(x){return x.d!==TODAY.key});hist.push({d:TODAY.key,s:t.dataset.ci});save("jtw:checkins",hist.slice(-60));render();return}
 if(t.id==="resetday"){if(confirm("Clear all ticks for today?")){state={};save(SK,state);render()}return}
 if(t.dataset.focus){
  var id=t.dataset.focus,ix=drillFocus.indexOf(id);
  if(ix>=0) drillFocus.splice(ix,1);
  else {
   if(drillFocus.length>=2) drillFocus.shift();
   drillFocus.push(id);
  }
  save("jtw:drillfocus:"+TODAY.key,drillFocus);render();return;
 }
 if(t.dataset.mode){drillMode=t.dataset.mode;save("jtw:drillmode",drillMode);render();return}
 if(t.dataset.toggleDrill){
  var id=t.dataset.toggleDrill;drillOpen[id]=!drillOpen[id];save("jtw:drillopen",drillOpen);
  var card=document.querySelector('[data-dopen="'+id+'"]');
  if(card){card.classList.toggle("open",!!drillOpen[id]);t.setAttribute("aria-expanded",drillOpen[id]?"true":"false")}
  return;
 }
 if(t.dataset.toggleFold){
  var fold=t.closest(".fold");if(fold)fold.classList.toggle("open");return;
 }
 if(t.dataset.toggleShot){
  var id=t.dataset.toggleShot;shotOpen[id]=!shotOpen[id];save("jtw:shotopen",shotOpen);
  var card=document.querySelector('[data-shot="'+id+'"]');
  if(card)card.classList.toggle("open",!!shotOpen[id]);
  return;
 }
 if(t.dataset.shotFilter!==undefined){
  window._shotFilter=t.dataset.shotFilter||"";render();return;
 }
});
document.addEventListener("change",function(ev){
 var c=ev.target;if(!c.dataset||!c.dataset.id)return;
 var id=c.dataset.id,n=+c.dataset.n,arr=state[id]||[];arr[+c.dataset.k]=c.checked;state[id]=arr;save(SK,state);
 var done=0;for(var k=0;k<n;k++)if(arr[k])done++;
 document.querySelectorAll('[data-card="'+id+'"]').forEach(function(el){el.classList.toggle("done",done===n)});
 updProgress();
 if(c.checked&&done<n)setRest(restFor({name:id}),true);
});

/* ---------- Timer ---------- */
var T={mode:"rest",len:60,left:60,run:false,iv:null,end:0,phases:null,pi:0};
var actx=null;
function beep(n){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();for(var i=0;i<(n||3);i++){var o=actx.createOscillator(),g=actx.createGain();o.frequency.value=880;o.connect(g);g.connect(actx.destination);var s=actx.currentTime+i*0.3;g.gain.setValueAtTime(0.3,s);g.gain.exponentialRampToValueAtTime(0.001,s+0.25);o.start(s);o.stop(s+0.26)}}catch(e){}}
function buzz(p){try{if(navigator.vibrate)navigator.vibrate(p)}catch(e){}}
function fmt(s){s=Math.max(0,Math.ceil(s));return Math.floor(s/60)+":"+("0"+s%60).slice(-2)}
function draw(){
 document.getElementById("tdisp").textContent=fmt(T.left);
 document.getElementById("tgo").textContent=T.run?"Pause":"Start";
 var l="Rest timer";if(T.phases){var ph=T.phases[T.pi];l=ph.label+" · "+(T.pi+1)+"/"+T.phases.length}
 document.getElementById("tlabel").textContent=l;
}
function stop(){T.run=false;clearInterval(T.iv);T.iv=null}
function tick(){
 T.left=(T.end-Date.now())/1000;
 if(T.left<=0){
  if(T.phases&&T.pi<T.phases.length-1){T.pi++;var ph=T.phases[T.pi];T.left=ph.s;T.end=Date.now()+ph.s*1000;beep(ph.hard?3:1);buzz(ph.hard?[200,100,200]:200)}
  else{T.left=0;stop();beep(4);buzz([300,150,300,150,300]);var el=document.getElementById("timer");el.classList.remove("alarm");void el.offsetWidth;el.classList.add("alarm")}
 }
 draw();
}
function start(){if(T.left<=0)resetT();try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();if(actx.resume)actx.resume()}catch(e){}T.end=Date.now()+T.left*1000;T.run=true;clearInterval(T.iv);T.iv=setInterval(tick,200);draw()}
function resetT(){stop();if(T.phases){T.pi=0;T.left=T.phases[0].s}else T.left=T.len;draw()}
function setRest(s,go){stop();T.phases=null;T.len=s;T.left=s;draw();if(go)start()}
function setPhases(p){stop();T.phases=p;T.pi=0;T.left=p[0].s;draw()}
document.getElementById("tgo").onclick=function(){T.run?(stop(),draw()):start()};
document.getElementById("treset").onclick=resetT;
document.getElementById("tint").onclick=function(){var p=[{label:"Get ready",s:10}];for(var i=1;i<=8;i++){p.push({label:"HARD "+i+"/8",s:30,hard:true});p.push({label:"Easy "+i+"/8",s:30})}setPhases(p)};
document.getElementById("tiso").onclick=function(){setPhases([{label:"Get ready",s:5},{label:"HOLD",s:45,hard:true}])};
document.getElementById("tisox").onclick=function(){var p=[{label:"Get ready",s:5}];for(var i=1;i<=5;i++){p.push({label:"HOLD "+i+"/5",s:45,hard:true});if(i<5)p.push({label:"Rest "+i+"/4",s:60})}setPhases(p)};
render();draw();
</script>
